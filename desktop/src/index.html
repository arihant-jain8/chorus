<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="app-header">
        <h1>Chorus</h1>
        <div class="status">
          <span class="status-dot"></span>
          <span class="status-label">Running</span>
          <button class="stop-btn">Stop</button>
        </div>
      </header>

      <section class="section">
        <p class="section-label">Source</p>
        <div class="card">
          <div class="card-top">
            <span class="icon">🔊</span>
            <span class="device-name" id="source-name"></span>
            <span class="badge">Capturing</span>
          </div>

          <div class="controls">
            <input type="range" class="volume-slider" id="source-volume" min="0" max="1" step="0.01" />
            <span class="percent" id="source-percent">0%</span>
            <button class="mute-btn" id="source-mute">🔇</button>
          </div>
        </div>
      </section>

      <section class="section">
        <p class="section-label">Outputs</p>
        <p class="section-sub">Mirroring to</p>
        <div id="sinks"></div>
      </section>
    </main>
  </body>
</html>
